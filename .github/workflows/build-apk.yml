name: Build GenSolar APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: gensolar-pro-final/gensolar-android-project/gensolar-android
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GenSolar-Pro-debug-APK
          path: gensolar-pro-final/gensolar-android-project/gensolar-android/app/build/outputs/apk/debug/app-debug.apk
