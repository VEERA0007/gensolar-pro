name: Build GenSolar APK
on:
  workflow_dispatch:
  push:
    branches: [ main, "fix/otp-crash-and-phone-prefix" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: gensolar-android-project/gensolar-android
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GenSolar-Pro-debug-APK
          path: gensolar-android-project/gensolar-android/app/build/outputs/apk/debug/app-debug.apk
