name: Build GenSolar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Android project
        working-directory: gensolar-android-project/gensolar-android
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          echo "Android project files found."

      - name: Build debug APK
        working-directory: gensolar-android-project/gensolar-android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GenSolar-Pro-debug-APK
          path: gensolar-android-project/gensolar-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
